{% extends "base.html" %}

{% block title %}Sign Up - BotBuilder{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 3rem auto;">
    <div class="glass-card">
        <h2 style="font-family: var(--font-heading); margin-bottom: 0.5rem; text-align: center;">Create Account</h2>
        <p style="color: var(--color-text-muted); font-size: 0.9rem; text-align: center; margin-bottom: 1.5rem;">
            Join BotBuilder to launch your custom business chatbot
        </p>

        <form action="/signup" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="yourname" required>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="owner@business.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password (min 6 characters)</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" minlength="6" required>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                Create Free Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--color-text-muted);">
            Already have an account? <a href="/login" style="color: var(--color-primary); font-weight: 600;">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
