version: '3.8'

services:
  web:
    build: .
    container_name: botbuilder_web
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - botbuilder_data:/app/data
      - botbuilder_db:/app/botbuilder.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  botbuilder_data:
  botbuilder_db:
